<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHOWTIME-NEW-999</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
}

header {
  padding: 18px;
  background: #1b1b1b;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 10px 15px;
  cursor: pointer;
  font-weight: bold;
}

.add-btn {
  background: #e50914;
  color: white;
}

.container {
  padding: 20px;
}

#movieGrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 18px;
}

.movie {
  background: #1d1d1d;
  border-radius: 10px;
  overflow: hidden;
}

.movie img {
  width: 100%;
  height: 240px;
  object-fit: cover;
  display: block;
}

.movie-info {
  padding: 12px;
}

.movie-info h3 {
  margin: 0 0 6px;
}

.movie-info p {
  color: #bbb;
  font-size: 14px;
}

.watch {
  display: inline-block;
  background: #e50914;
  color: white;
  text-decoration: none;
  padding: 8px 12px;
  border-radius: 6px;
  margin-top: 5px;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.8);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.form {
  width: 100%;
  max-width: 450px;
  background: #222;
  padding: 20px;
  border-radius: 12px;
}

.form h2 {
  margin-top: 0;
}

input,
textarea {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border: 0;
  border-radius: 6px;
  background: #333;
  color: white;
}

textarea {
  height: 90px;
  resize: vertical;
}

.form-buttons {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.save {
  background: #e50914;
  color: white;
}

.cancel {
  background: #555;
  color: white;
}
</style>
</head>

<body>

<header>
  <div class="logo">🎬 ShowTime</div>
  <button class="add-btn" onclick="openForm()">＋ Add Movie</button>
</header>

<div class="container">
  <h2>Movies</h2>
  <div id="movieGrid"></div>
</div>

<!-- ADD MOVIE FORM -->
<div class="modal" id="modal">
  <div class="form">

    <h2>Add Movie</h2>

    <input id="title" placeholder="Movie name">
    <input id="poster" placeholder="Poster image URL">
    <input id="year" placeholder="Year">
    <input id="genre" placeholder="Genre">
    <input id="rating" placeholder="Rating">
    <textarea id="description" placeholder="Description"></textarea>
    <input id="watch" placeholder="Official trailer/watch URL">

    <div class="form-buttons">
      <button class="save" onclick="addMovie()">Add Movie</button>
      <button class="cancel" onclick="closeForm()">Cancel</button>
    </div>

  </div>
</div>

<script>

let movies = JSON.parse(localStorage.getItem("showtimeMovies")) || [];

/* Open form */
function openForm() {
  document.getElementById("modal").style.display = "flex";
}

/* Close form */
function closeForm() {
  document.getElementById("modal").style.display = "none";
}

/* Add movie */
function addMovie() {

  const movie = {
    title: document.getElementById("title").value,
    poster: document.getElementById("poster").value,
    year: document.getElementById("year").value,
    genre: document.getElementById("genre").value,
    rating: document.getElementById("rating").value,
    description: document.getElementById("description").value,
    watch: document.getElementById("watch").value
  };

  if (!movie.title || !movie.poster) {
    alert("Please enter at least the movie name and poster URL.");
    return;
  }

  movies.push(movie);

  localStorage.setItem(
    "showtimeMovies",
    JSON.stringify(movies)
  );

  renderMovies();

  closeForm();

  document.querySelectorAll(".form input, .form textarea")
    .forEach(element => element.value = "");
}

/* Display movies */
function renderMovies() {

  const grid = document.getElementById("movieGrid");

  grid.innerHTML = "";

  movies.forEach(movie => {

    grid.innerHTML += `
      <div class="movie">

        <img src="${movie.poster}"
             alt="${movie.title}"
             onerror="this.src='https://via.placeholder.com/300x450?text=No+Poster'">

        <div class="movie-info">

          <h3>${movie.title}</h3>

          <p>
            ${movie.year || ""}
            ${movie.genre ? " • " + movie.genre : ""}
          </p>

          <p>
            ⭐ ${movie.rating || "N/A"}
          </p>

          <p>
            ${movie.description || ""}
          </p>

          ${
            movie.watch
            ? `<a class="watch"
                 href="${movie.watch}"
                 target="_blank">
                 ▶ Watch / Trailer
               </a>`
            : ""
          }

        </div>

      </div>
    `;
  });
}

/* Load movies when page opens */
renderMovies();

</script>

</body>
</html>
